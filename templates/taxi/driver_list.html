{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>
  <ul>
    {% for driver in driver_list %}
      <li>
        <a href="{% url 'taxi:driver-detail' driver.pk %}">
          {{ driver.name }}
        </a>
      </li>
    {% empty %}
      <li>
        <p>No drivers available</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
