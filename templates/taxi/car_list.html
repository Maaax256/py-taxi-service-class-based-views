{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  <ul>
    {% for car in car_list %}
      <li>
        <a href="{% url "taxi:car-detail" car.pk %}">
          {{ car.pk }} {{ car.model }} {{ car.manufacturer.name }}
        </a>
      </li>
    {% empty %}
      <li>
        <p>No cars available</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
