{% extends "base.html" %}

{% block content %}
  <h1>Car details</h1>
  <p>{{ car.manufacturer }}</p>
  <ul>
    {% for driver in car.drivers.all %}
      <li>
        {{ driver.pk }} {{ driver.username }}
      </li>
    {% empty %}
      <li>
        <p>No drivers drive this car</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
